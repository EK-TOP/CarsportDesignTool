services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carsport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carsport}
      POSTGRES_DB: ${POSTGRES_DB:-carsport}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carsport}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carsport}:${POSTGRES_PASSWORD:-carsport}@postgres:5432/${POSTGRES_DB:-carsport}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: ./backend
    restart: "no"
    command: ["node", "prisma/seed.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carsport}:${POSTGRES_PASSWORD:-carsport}@postgres:5432/${POSTGRES_DB:-carsport}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carsport}:${POSTGRES_PASSWORD:-carsport}@postgres:5432/${POSTGRES_DB:-carsport}
      REDIS_URL: redis://redis:6379
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/node_modules

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      REALTIME_ENABLED: ${REALTIME_ENABLED:-false}
      # Reserved for future persisted realtime collaboration:
      # DATABASE_URL: postgresql://...@postgres:5432/...
    ports:
      - "127.0.0.1:5000:5000"
    # Reserved for when the realtime service uses persisted collaboration data:
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
      - server
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
